<div class="products-page">
  <aside class="sidebar">
    <h2>Filtrar por</h2>

    <label class="sidebar__field">
      Marca
      <select (change)="selectBrand($any($event.target).value || null)">
        <option value="" [selected]="!selectedBrand()">Todas</option>
        @for (brand of filterableBrands(); track brand.id) {
          <option [value]="brand.id" [selected]="brand.id === selectedBrand()">
            {{ brand.name }}
          </option>
        }
      </select>
    </label>

    @if (selectedBrand() === 'chardon') {
      <label class="sidebar__field">
        Grupo
        <select (change)="selectGroup($any($event.target).value || null)">
          <option value="" [selected]="!selectedGroup()">Todos</option>
          @for (group of groupOptions(); track group.id) {
            <option [value]="group.id" [selected]="group.id === selectedGroup()">
              {{ group.name }}
            </option>
          }
        </select>
      </label>
    }
  </aside>

  <section class="results">
    @if (filteredProducts().length === 0) {
      <p class="results__empty">No se encontraron productos con estos filtros.</p>
    } @else {
      <div class="results__grid">
        @for (product of visibleProducts(); track product.id) {
          <app-product-card [product]="product" (activated)="openProduct($event)" />
        }
      </div>
    }

    @if (hasMore()) {
      <div #sentinel class="results__sentinel" aria-hidden="true"></div>
    }
  </section>
</div>

@if (selectedProduct()) {
  <app-product-modal [product]="selectedProduct()!" (closed)="closeProduct()" />
}
