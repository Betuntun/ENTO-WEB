<header class="header">
  <a routerLink="/" class="header__logo">
    <img src="images/brands/ento-logo.png" alt="ENTO Aislantes e Ingeniería" />
  </a>

  <form class="header__search" (submit)="$event.preventDefault(); onSearchSubmit()">
    <svg
      class="header__search-icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
    <input
      type="search"
      placeholder="Buscar productos..."
      aria-label="Buscar productos"
      [value]="searchTerm()"
      (input)="onSearchInput($any($event.target).value)"
    />
  </form>

  <nav class="header__nav">
    @if (isOnProductsPage()) {
      <a routerLink="/">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M12 3 3 10h2v10h6v-6h2v6h6V10h2z" />
        </svg>
        Inicio
      </a>
    } @else {
      <a routerLink="/productos">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M21 8.5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10L3 8l9-5 9 5zM5 10v7h14v-7l-7-3.85z"
          />
        </svg>
        Productos
      </a>
    }
    <a href="#footer" (click)="$event.preventDefault(); scrollToContact()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path
          d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.36 11.36 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.24.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"
        />
      </svg>
      Contacto
    </a>
  </nav>
</header>
