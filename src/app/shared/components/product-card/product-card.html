<article
  class="product-card"
  role="button"
  tabindex="0"
  (click)="activated.emit(product())"
  (keydown.enter)="activated.emit(product())"
>
  <div class="product-card__image">
    <img [src]="product().imageUrl" [alt]="product().name" loading="lazy" />
  </div>
  <p class="product-card__name">{{ product().name }}</p>
</article>
